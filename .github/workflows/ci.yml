name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate mini program structure
        run: npm run validate:wechat

      - name: Validate travel templates
        run: npm run validate:travel-templates

      - name: Run tests
        run: npm test

      - name: Cloud function module resolution smoke test
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const Module = require("module");
          const originalLoad = Module._load;
          Module._load = function (request, parent, isMain) {
            if (request === "wx-server-sdk") {
              return {
                init() {},
                database: () => ({ command: {}, collection() {} }),
                DYNAMIC_CURRENT_ENV: "ci",
                getWXContext: () => ({})
              };
            }
            return originalLoad.call(this, request, parent, isMain);
          };
          const dir = "apps/wechat-miniprogram/cloudfunctions";
          let count = 0;
          for (const name of fs.readdirSync(dir)) {
            const entry = path.resolve(dir, name, "index.js");
            if (fs.existsSync(entry)) {
              require(entry);
              count += 1;
            }
          }
          console.log(`Resolved ${count} cloud function entrypoints.`);
          EOF
